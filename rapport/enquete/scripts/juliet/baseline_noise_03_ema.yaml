# Juliet, 8/11 : baseline commune + bruit d instance 0.3 + EMA (G_raw.pth = sans EMA).
# pendant l'entraînement change (petit CNN sur val). Lancé par scripts/compare_local.py.
# Baseline commune : même entraînement que baseline_200ep_prof, mesuré toutes les 10 époques.
name: j2_baseline_noise_03_ema
seed: 0

train:
  epochs: 200
  batch_size: 100

optimizer:
  name: adam
  lr: 0.0002
  betas: [0.9, 0.999]

output:
  dir: runs
  save_every: 200

eval:
  every: 10
  n_samples: 10000
  k: 3
  prof: false   # Inception + VGG trop lents sur Mac à chaque mesure : mesurés à la fin, sur test

ema:
  decay: 0.999

data:
  instance_noise:
    enabled: true
    sigma: 0.3
    anneal_epochs: 100
