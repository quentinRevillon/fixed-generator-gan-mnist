# Baseline commune du groupe. Copier ce fichier pour chaque nouvelle expérience.
# Données : split figé train (50k) / val (10k) / test (10k) défini dans gan/data.py (pas de paramètre ici :
# c'est un contrat commun). $DATA est utilisé s'il est défini (Juliet), sinon MNIST est téléchargé dans data/.
name: baseline_v1         # dossier de sortie : <output.dir>/<name>/ (v1 = première baseline sur le split train/val)
seed: 0

train:
  epochs: 50
  batch_size: 100

optimizer:
  name: adam
  lr: 0.0002              # point décimal obligatoire (0,0002 serait lu comme du texte)
  betas: [0.9, 0.999]

output:
  dir: runs
  save_every: 10          # checkpoint ckpt/epoch_XXX.pth toutes les N époques (+ last.pth à chaque époque)

eval:
  every: 10               # FID / precision / recall sur 'val' toutes les N époques
  n_samples: 10000
  k: 3                    # k plus proches voisins pour precision / recall
