# Baseline commune : même entraînement que baseline_200ep_prof, mesuré toutes les 10 époques.
name: cmp_baseline
seed: 0

train:
  epochs: 200
  batch_size: 100

optimizer:
  name: adam
  lr: 0.0002
  betas: [0.9, 0.999]

output:
  dir: runs
  save_every: 100

eval:
  every: 10
  n_samples: 10000
  k: 3
  prof: true
