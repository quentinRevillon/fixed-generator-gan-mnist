# Baseline + perte RpGAN + R1 (Huang et al. 2024), seul changement.
name: cmp_rpgan_r1
seed: 0

loss:
  name: rpgan
  r1_gamma: 1.0
  r2_gamma: 0.0

train:
  epochs: 200
  batch_size: 100

optimizer:
  name: adam
  lr: 0.0002
  betas: [0.9, 0.999]

output:
  dir: runs
  save_every: 100

eval:
  every: 10
  n_samples: 10000
  k: 3
  prof: true
