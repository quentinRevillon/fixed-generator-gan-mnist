# Baseline + sélection de 50 % des images (DeVries et al. 2020). 400 époques : même nombre de mises à jour.
name: cmp_sel_50
seed: 0

data:
  selection:
    enabled: true
    keep: 0.5
    per_class: true
    space: classifier

train:
  epochs: 400
  batch_size: 100

optimizer:
  name: adam
  lr: 0.0002
  betas: [0.9, 0.999]

output:
  dir: runs
  save_every: 100

eval:
  every: 20
  n_samples: 10000
  k: 3
  prof: true
