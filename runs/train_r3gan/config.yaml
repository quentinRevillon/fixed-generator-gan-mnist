name: train_r3gan
seed: 0
data:
  path: data
train:
  epochs: 50
  batch_size: 100
  num_workers: 4
optimizer:
  name: adam
  lr: 0.0002
  betas:
  - 0.9
  - 0.999
output:
  dir: runs
  save_every: 10
eval:
  every: 10
  n_samples: 10000
  k: 3
loss:
  name: rpgan
  r1_gamma: 1.0
  r2_gamma: 1.0
git_commit: unknown
